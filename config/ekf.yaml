###
# EKF configuration for BobbleBot
# Fuses wheel odometry + IMU for state estimation
###
/bobble/ekf_filter_node:
  ros__parameters:
    frequency: 500.0
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: bobble_chassis_link
    world_frame: odom

    # Wheel odometry: fuse vx, vy, vz
    # vy=0 and vz=0 act as zero-velocity constraints for a diff drive robot,
    # preventing y and z position covariance from growing unbounded.
    odom0: /bobble_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # IMU: fuse orientation, angular velocity, linear acceleration
    imu0: /bobble/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
